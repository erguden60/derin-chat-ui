<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>derin-chat-ui Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Inter, 'Segoe UI', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 15% 12%, rgba(99, 102, 241, 0.32), transparent 34%),
        radial-gradient(circle at 82% 18%, rgba(20, 184, 166, 0.22), transparent 28%),
        linear-gradient(135deg, #0b1020 0%, #111827 52%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      padding: 20px;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
    }
    .hero { text-align: center; margin-bottom: 34px; max-width: 760px; }
    .hero h1 {
      font-size: clamp(2.6rem, 7vw, 5rem); font-weight: 800; margin-bottom: 12px;
      letter-spacing: -0.04em;
      background: linear-gradient(90deg, #ffffff, #a5b4fc 48%, #5eead4);
	      background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero p { color: #cbd5e1; font-size: 1.05rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(15,23,42,0.72); border: 1px solid rgba(148,163,184,0.22);
      border-radius: 999px; padding: 8px 14px; font-size: 0.78rem;
      color: #dbeafe; margin-bottom: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 18px 40px -28px #000;
    }
    .badge span {
      width: 7px; height: 7px; background: #4ade80;
      border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .info-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 14px; max-width: 760px; width: 100%; margin-bottom: 30px;
    }
    .info-card {
      background: rgba(15, 23, 42, 0.58); border: 1px solid rgba(148,163,184,0.16);
      border-radius: 10px; padding: 18px 16px; text-align: center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 22px 50px -40px #000;
      backdrop-filter: blur(10px);
    }
    .info-card .label { font-size: 0.72rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 7px; }
    .info-card .value { font-size: 1rem; font-weight: 700; color: #f8fafc; }
    .controls { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
    button { padding: 10px 22px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #6366f1, #14b8a6); color: #fff; box-shadow: 0 18px 30px -22px #22d3ee; }
    .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
    .btn-secondary { background: rgba(15,23,42,0.68); color: #e2e8f0; border: 1px solid rgba(148,163,184,0.2); }
    .btn-secondary:hover { background: rgba(30,41,59,0.82); transform: translateY(-1px); }
    .btn-danger { background: rgba(239,68,68,0.2); color: #fca5a5; border: 1px solid rgba(239,68,68,0.3); }
    .btn-danger:hover { background: rgba(239,68,68,0.3); }
    .log {
      max-width: 760px; width: 100%; background: rgba(2,6,23,0.62);
      border: 1px solid rgba(148,163,184,0.16); border-radius: 10px;
      padding: 16px; font-family: monospace; font-size: 0.82rem; color: #94a3b8;
      max-height: 200px; overflow-y: auto;
      backdrop-filter: blur(10px);
    }
    .log .entry { padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log .entry.sent { color: #60a5fa; }
    .log .entry.received { color: #4ade80; }
    .log .entry.event { color: #f59e0b; }
    .log .entry.error { color: #f87171; }
    .log-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #475569; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="hero">
    <div class="badge"><span></span> Mock mode active — no backend required</div>
    <h1>derin-chat-ui</h1>
    <p>v1.0.11 · Emirhan Ergüden · MIT License</p>
  </div>

  <div class="info-grid">
    <div class="info-card"><div class="label">Package</div><div class="value">derin-chat-ui</div></div>
    <div class="info-card"><div class="label">Engine</div><div class="value">Preact 10+</div></div>
    <div class="info-card"><div class="label">Size</div><div class="value">~29-33 KB gzip</div></div>
    <div class="info-card"><div class="label">Isolation</div><div class="value">Shadow DOM</div></div>
  </div>

  <div class="controls">
    <button class="btn-primary" onclick="initChat()">🚀 Start Widget</button>
    <button class="btn-secondary" onclick="loadHistory()">📂 Load History</button>
    <button class="btn-secondary" onclick="checkActive()">📡 Is Active?</button>
    <button class="btn-danger" onclick="destroyChat()">🗑 Destroy</button>
  </div>

  <div class="log">
    <div class="log-title">📋 Event Log</div>
    <div id="log-entries"></div>
  </div>

<script>
	    function log(msg, type = '') {
	      const el = document.createElement('div');
	      el.className = `entry ${type}`;
	      el.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
	      document.getElementById('log-entries').prepend(el);
	    }

	    let inputLockObserver;

	    function lockChatTyping(instanceId = 'demo') {
	      const host = document.getElementById(`derin-chat-host-${instanceId}`);
	      const root = host?.shadowRoot;
	      if (!root) return;

	      if (!root.getElementById('demo-input-lock-style')) {
	        const style = document.createElement('style');
	        style.id = 'demo-input-lock-style';
	        style.textContent = `
	          .chat-input-area textarea {
	            opacity: 0.55 !important;
	            cursor: not-allowed !important;
	            pointer-events: none !important;
	          }
	          .chat-input-area .send-btn {
	            opacity: 0.35 !important;
	            cursor: not-allowed !important;
	            pointer-events: none !important;
	          }
	        `;
	        root.appendChild(style);
	      }

	      const textarea = root.querySelector('.chat-input-area textarea');
	      const sendButton = root.querySelector('.chat-input-area .send-btn');

	      if (textarea) {
	        textarea.value = '';
	        textarea.disabled = true;
	        textarea.readOnly = true;
	        textarea.placeholder = 'Text input is disabled';
	        textarea.setAttribute('aria-disabled', 'true');
	        textarea.setAttribute('tabindex', '-1');
	      }

	      if (sendButton) {
	        sendButton.disabled = true;
	        sendButton.setAttribute('aria-disabled', 'true');
	        sendButton.setAttribute('tabindex', '-1');
	      }

	      if (!inputLockObserver) {
	        inputLockObserver = new MutationObserver(() => lockChatTyping(instanceId));
	        inputLockObserver.observe(root, { childList: true, subtree: true });
	      }
	    }

	    function enhanceChatTheme(instanceId = 'demo') {
	      const host = document.getElementById(`derin-chat-host-${instanceId}`);
	      const root = host?.shadowRoot;
	      if (!root || root.getElementById('demo-chat-polish-style')) return;

	      const style = document.createElement('style');
	      style.id = 'demo-chat-polish-style';
	      style.textContent = `
	        .chat-window {
	          width: 390px;
	          height: 640px;
	          border-radius: 22px;
	          border-color: rgba(148, 163, 184, 0.22);
	          box-shadow:
	            0 34px 80px -34px rgba(15, 23, 42, 0.92),
	            0 12px 32px -24px rgba(20, 184, 166, 0.5);
	        }
	        .chat-header {
	          padding: 18px 18px 16px;
	        }
	        .header-logo {
	          background: rgba(255,255,255,0.22);
	        }
	        .chat-messages {
	          gap: 8px;
	          padding: 18px 16px;
	        }
	        .message {
	          border-radius: 16px;
	          font-size: 13.5px;
	        }
	        .message.bot {
	          border-color: rgba(203, 213, 225, 0.72);
	        }
	        .message.user {
	          box-shadow: 0 16px 28px -24px rgba(79, 70, 229, 0.8);
	        }
	        .quick-replies {
	          gap: 8px;
	          margin-top: 10px;
	        }
	        .quick-reply-btn {
	          border-radius: 999px;
	          border: 1px solid rgba(79, 70, 229, 0.26);
	          background: color-mix(in srgb, var(--primary, #4f46e5) 10%, #ffffff);
	          color: #312e81;
	          font-weight: 700;
	          box-shadow: 0 8px 18px -16px rgba(49, 46, 129, 0.7);
	          transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
	        }
	        .quick-reply-btn:hover {
	          transform: translateY(-1px);
	          border-color: rgba(79, 70, 229, 0.72);
	          background: linear-gradient(135deg, #4f46e5, #14b8a6);
	          color: #ffffff;
	          box-shadow: 0 14px 26px -16px rgba(79, 70, 229, 0.8);
	        }
	        .quick-reply-btn:focus-visible {
	          outline: 3px solid rgba(20, 184, 166, 0.28);
	          outline-offset: 2px;
	        }
	        .chat-input-area {
	          display: flex;
	          align-items: center;
	          gap: 10px;
	          padding: 12px 14px 14px;
	          border-top: 1px solid rgba(226, 232, 240, 0.86);
	          background: rgba(248, 250, 252, 0.94);
	        }
	        .chat-input-area .chat-input-field {
	          flex: 1 1 auto;
	          min-width: 0;
	          height: 44px;
	          display: flex;
	          align-items: center;
	          border-radius: 999px;
	          border: 1px solid rgba(203, 213, 225, 0.9);
	          background: #ffffff;
	          overflow: hidden;
	        }
	        .chat-input-area textarea {
	          width: 100%;
	          height: 42px !important;
	          min-height: 42px !important;
	          max-height: 42px !important;
	          box-sizing: border-box;
	          padding: 11px 14px !important;
	          border: 0 !important;
	          background: transparent !important;
	          line-height: 20px;
	        }
	        .chat-input-area .send-btn {
	          flex: 0 0 42px;
	          width: 42px;
	          height: 42px;
	          border-radius: 999px;
	          margin: 0;
	        }
	      `;
	      root.appendChild(style);
	    }

	    function loadInitialReadyAnswer() {
	      DerinChat.loadMessages([
	        {
	          id: 'ready-start',
	          text: 'Hello! Text input is disabled, so you can start directly with quick replies. Choose a topic below and I will return a README-based demo answer right away.',
	          sender: 'bot',
	          timestamp: new Date().toISOString(),
	          agent: demoAgent,
	          quickReplies: quickReplySets.main,
	        },
	      ], 'demo');
	    }

	    function startWithReadyAnswer(attempt = 0) {
	      const host = document.getElementById('derin-chat-host-demo');
	      const root = host?.shadowRoot;
	      const isChatMounted = Boolean(root?.querySelector('.chat-messages'));

	      if (!isChatMounted && attempt < 20) {
	        setTimeout(() => startWithReadyAnswer(attempt + 1), 100);
	        return;
	      }

	      loadInitialReadyAnswer();
	      enhanceChatTheme('demo');
	      lockChatTyping('demo');
	      log('🤖 Initial quick-reply answer loaded', 'event');
	    }

	    const demoAgent = {
	      name: 'Derin Demo Assistant',
	      avatar: 'https://ui-avatars.com/api/?name=Derin+AI&background=6366f1&color=fff',
	      isOnline: true,
	    };

	    const quickReplySets = {
	      main: [
	        { label: 'What is it?', value: 'what is the package', icon: '📦' },
	        { label: 'Features', value: 'features', icon: '⚙️' },
	        { label: 'Connection modes', value: 'connection modes', icon: '🔌' },
	        { label: 'Installation', value: 'installation', icon: '🧩' },
	      ],
	      connection: [
	        { label: 'HTTP', value: 'http mode', icon: '📡' },
	        { label: 'WebSocket', value: 'websocket mode', icon: '🔌' },
	        { label: 'SSE Streaming', value: 'sse mode', icon: '🌊' },
	        { label: 'Mock', value: 'mock mode', icon: '🧪' },
	      ],
	      afterAnswer: [
	        { label: 'Example response', value: 'full response example', icon: '🧾' },
	        { label: 'Security', value: 'security', icon: '🔒' },
	        { label: 'Thanks', value: 'thanks', icon: '✅' },
	      ],
	    };

	    const normalizeText = (value) => String(value || '')
	      .toLocaleLowerCase('en-US')
	      .normalize('NFD')
	      .replace(/[\u0300-\u036f]/g, '')
	      .replace(/ı/g, 'i')
	      .replace(/ğ/g, 'g')
	      .replace(/ü/g, 'u')
	      .replace(/ş/g, 's')
	      .replace(/ö/g, 'o')
	      .replace(/ç/g, 'c');

	    const includesAny = (text, words) => words.some((word) => text.includes(word));

	    const createBotResponse = ({ reply, quickReplies = quickReplySets.afterAnswer, image, actions }) => ({
	      reply,
	      type: 'bot',
	      agent: demoAgent,
	      ...(image ? { image } : {}),
	      ...(actions ? { actions } : {}),
	      ...(quickReplies ? { quickReplies } : {}),
	    });

	    const readyResponses = [
	      {
	        keywords: ['hello', 'hi', 'start', 'help'],
	        response: () => createBotResponse({
	          reply: 'Hello! I am the Derin Chat test bot. I can demonstrate the SDK features from the README live in mock mode. Choose a topic below or type your question.',
	          quickReplies: quickReplySets.main,
	        }),
	      },
	      {
	        keywords: ['package', 'what', 'sdk'],
	        response: () => createBotResponse({
	          reply: 'derin-chat-ui is a framework-agnostic chat widget SDK that can be embedded in HTML, React, Vue, Next.js, Svelte, and similar environments with Shadow DOM isolation. It supports HTTP, WebSocket, SSE streaming, and mock/headless modes.',
	          quickReplies: quickReplySets.afterAnswer,
	        }),
	      },
	      {
	        keywords: ['feature', 'features', 'capabilities'],
	        response: () => createBotResponse({
	          reply: 'Key features:\n\n- CSS isolation with Shadow DOM\n- HTTP REST, SSE streaming, and WebSocket connections\n- Mock/headless prototyping\n- Multi-instance support\n- Voice input/output\n- localStorage session persistence\n- Markdown, quick replies, file upload, and message tools\n- XSS protection, protocol allowlisting, and HMAC user verification',
	          quickReplies: quickReplySets.connection,
	        }),
	      },
	      {
	        keywords: ['connection', 'mode', 'websocket', 'http', 'sse', 'stream'],
	        response: () => createBotResponse({
	          reply: 'There are five practical connection options:\n\n- HTTP: Standard POST-based request/response\n- SSE Streaming: Incremental typewriter responses\n- WebSocket: Bidirectional real-time communication\n- Auto Fallback: Falls back to HTTP when WebSocket is unavailable\n- Mock: Prototype and test without a backend',
	          quickReplies: quickReplySets.connection,
	        }),
	      },
	      {
	        keywords: ['http mode', 'rest'],
	        response: () => createBotResponse({
	          reply: 'In HTTP mode, the widget sends a JSON POST request to your backend. The body can include `message`, optional `user`, `history`, `file`, and `sessionId`. The backend should return at least `{ "reply": "..." }`.',
	          quickReplies: quickReplySets.connection,
	        }),
	      },
	      {
	        keywords: ['websocket mode', 'socket'],
	        response: () => createBotResponse({
	          reply: 'WebSocket mode is for full-duplex communication. Auto reconnect, heartbeat ping/pong, and message queue behavior are described in the README contracts for real-time scenarios.',
	          quickReplies: quickReplySets.connection,
	        }),
	      },
	      {
	        keywords: ['sse mode', 'streaming', 'typewriter'],
	        response: () => createBotResponse({
	          reply: 'In SSE Streaming mode, the backend can send incremental responses with `data: {...}` lines. The SDK can read text from `reply`, `text`, or OpenAI-compatible `choices[0].delta.content` fields.',
	          quickReplies: quickReplySets.connection,
	        }),
	      },
	      {
	        keywords: ['mock mode', 'mock', 'headless'],
	        response: (message, context) => createBotResponse({
	          reply: `Mock mode works without a backend. This demo can currently read ${context.history.length} messages from the handler context${context.file ? ` and can see the "${context.file.name}" file` : ''}. The handler may return either a string or a full response object.`,
	          quickReplies: quickReplySets.main,
	        }),
	      },
	      {
	        keywords: ['installation', 'cdn', 'install', 'npm'],
	        response: () => createBotResponse({
	          reply: 'For installation, use `npm install derin-chat-ui preact` on the npm side, or the UMD script tag from the README on the CDN side. In an HTML integration, you can quickly start with `window.DerinChat.init({ mock: true })`.',
	          actions: [
	            { text: 'README Quick Start', url: 'https://www.npmjs.com/package/derin-chat-ui' },
	          ],
	          quickReplies: quickReplySets.main,
	        }),
	      },
	      {
	        keywords: ['full response', 'response example', 'example response', 'api response'],
	        response: () => createBotResponse({
	          reply: 'A full response can include these fields: `reply`, `type`, `image`, `quickReplies`, `actions`, and `agent`. This message has agent and quickReplies enabled; in supporting builds, image/actions can come from the same response too.',
	          image: {
	            url: 'https://dummyimage.com/640x320/1e293b/e2e8f0.png&text=Derin+Chat+UI+Mock+Response',
	            alt: 'Derin Chat UI full mock response preview',
	          },
	          actions: [
	            { text: 'Documentation', url: 'https://www.npmjs.com/package/derin-chat-ui' },
	          ],
	          quickReplies: quickReplySets.main,
	        }),
	      },
	      {
	        keywords: ['security', 'xss', 'hmac'],
	        response: () => createBotResponse({
	          reply: 'On the security side, the SDK targets protections such as markdown sanitization, URL protocol allowlisting, rate limiting, and HMAC user verification. The host application CSS also cannot leak into the widget thanks to Shadow DOM.',
	          quickReplies: quickReplySets.main,
	        }),
	      },
	      {
	        keywords: ['thanks', 'thank you'],
	        response: () => createBotResponse({
	          reply: 'You are welcome. The demo quick-reply system is working; choose another topic to continue.',
	          quickReplies: quickReplySets.main,
	        }),
	      },
	    ];

	    function initChat() {
	      try {
	        DerinChat.init({
	          instanceId: 'demo',
	          mock: {
	            handler: async (message, context) => {
	              await new Promise(r => setTimeout(r, 500 + Math.random() * 700));
	              const normalizedMessage = normalizeText(message);
	              const match = readyResponses.find(({ keywords }) => includesAny(normalizedMessage, keywords));

	              if (match) return match.response(message, context);

	              return createBotResponse({
	                reply: `I could not find a prepared answer for "${message}". You can choose one of the README-based demo topics: package, features, connection modes, installation, security, or full response example.`,
	                quickReplies: quickReplySets.main,
	              });
	            }
	          },
	          ui: {
	            theme: 'light',
	            position: 'bottom-right',
	            logo: 'https://ui-avatars.com/api/?name=Derin+AI&background=4f46e5&color=fff',
	            layout: 'normal',
	            colors: {
	              primary: '#4f46e5',
	              headerBg: '#312e81',
	              headerText: '#ffffff',
	              userMessageBg: '#4f46e5',
	              userMessageText: '#ffffff',
	              botMessageBg: '#ffffff',
	              botMessageText: '#0f172a',
	              background: '#f8fafc',
	              inputBg: '#ffffff',
	              inputText: '#0f172a',
	            },
            texts: {
              title: 'Derin AI Demo',
              subtitle: 'Mock mode · Ready',
              placeholder: 'Choose a quick reply...',
              loading: 'Typing...',
              welcomeBadge: 'SDK demo',
              welcomeMessage: 'Explore Derin Chat UI without connecting a backend.',
              welcomeHints: ['HTTP / WebSocket', 'Mock handler', 'Shadow DOM'],
              copy: 'Copy',
              copied: 'Copied',
              regenerate: 'Regenerate',
              helpful: 'Helpful',
              notHelpful: 'Not helpful',
            },
          },
          behavior: { openOnLoad: true, persistSession: false },
          features: { markdown: true, quickReplies: true, timestamps: true, avatars: true, messageTools: true },
          onMessageSent: (msg) => log(`➡ Sent: "${msg}"`, 'sent'),
          onMessageReceived: (res) => log(`⬅ Received: "${String(res?.reply||'').slice(0,50)}..."`, 'received'),
          onChatOpened: () => log('📭 Widget opened', 'event'),
          onChatClosed: () => log('📪 Widget closed', 'event'),
          onError: (err) => log(`❌ Error: ${err}`, 'error'),
	        });
	        setTimeout(() => startWithReadyAnswer(), 150);
	        log('✅ Widget started (mock mode)', 'event');
	      } catch(e) {
	        log(`❌ Init error: ${e.message}`, 'error');
	      }
	    }

    function loadHistory() {
      try {
        DerinChat.loadMessages([
          { id: '1', text: 'This is a previous message.', sender: 'user', timestamp: new Date(Date.now()-120000).toISOString() },
          { id: '2', text: 'Hello! History has been loaded. 👋', sender: 'bot', timestamp: new Date(Date.now()-60000).toISOString() },
        ], 'demo');
        log('📂 History messages loaded', 'event');
      } catch(e) { log(`❌ loadMessages: ${e.message}`, 'error'); }
    }

    function checkActive() {
      try {
        const active = DerinChat.isActive('demo');
        log(`📡 isActive('demo') → ${active}`, 'event');
      } catch(e) { log(`❌ isActive: ${e.message}`, 'error'); }
    }

    function destroyChat() {
      try {
        DerinChat.destroy('demo');
        log('🗑 Widget destroyed', 'event');
      } catch(e) { log(`❌ Destroy: ${e.message}`, 'error'); }
    }

    window.addEventListener('load', () => {
      log(`📦 DerinChat loaded — typeof: ${typeof DerinChat}`, 'event');
      setTimeout(initChat, 300);
    });
</script>
</body>
</html>
